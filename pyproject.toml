[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name="1c-zup-payroll-automation"
version="0.1.0"
requires-python=">=3.11"
description="Payroll-cycle control plane that leaves tax/payroll calculation inside ZUP while enforcing checks, approval, anomaly review, idempotent bank export, and reconciliation."

[project.optional-dependencies]
dev=["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
addopts="-q"

[tool.ruff.lint]
select=["E4", "E7", "E9", "F"]
